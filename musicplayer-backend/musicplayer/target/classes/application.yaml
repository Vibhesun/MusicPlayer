
spring:
  application:
    name: musicplayer

  datasource:
    url: jdbc:mysql://localhost:3306/onlinemusicplayer?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8080

music:
  upload-dir: uploads
